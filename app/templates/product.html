{% extends 'base.html' %}{% block content %}<a href="{{url_for('shop.home')}}">← Voltar ao cardápio</a><section class="detail"><img src="{{url_for('static',filename='cupcake.svg')}}" alt="Ilustração de cupcake; imagem ilustrativa" width="300" height="300"><div><p class="eyebrow">{{p.flavor}}</p><h1>{{p.name}}</h1><p>{{p.description}}</p><p><strong>Alergênicos:</strong> {{p.allergens}}</p><p>{{p.stock}} unidades disponíveis</p><p class="price">{{p.price_cents|money}}</p><form method="post" action="{{url_for('shop.cart_change',pid=p.id)}}"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="action" value="add"><label for="quantity">Quantidade</label><input type="number" id="quantity" name="quantity" min="1" max="99" value="1" required><button {% if p.stock==0 %}disabled{% endif %}>Adicionar ao carrinho</button></form></div></section>{% endblock %}
