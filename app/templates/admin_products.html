{% extends 'base.html' %}{% block content %}<a href="{{url_for('shop.admin')}}">← Pedidos</a><h1>Produtos</h1><a class="button" href="{{url_for('shop.edit_product')}}">Novo cupcake</a>{% for p in products %}<article class="cart-row"><div><h2>{{p.name}}</h2><p>{{p.price_cents|money}} · Estoque: {{p.stock}} · {{'Ativo' if p.active else 'Inativo'}}</p></div><a href="{{url_for('shop.edit_product',pid=p.id)}}">Editar {{p.name}}</a></article>{% endfor %}{% endblock %}
